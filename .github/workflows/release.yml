name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release-artifacts:
    name: Build release artifacts
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Use workspace Pub cache
        shell: pwsh
        run: |
          $pubCache = Join-Path $env:GITHUB_WORKSPACE '.pub-cache'
          "PUB_CACHE=$pubCache" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Android signing
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $required = @(
            'ANDROID_KEYSTORE_BASE64',
            'ANDROID_KEYSTORE_PASSWORD',
            'ANDROID_KEY_ALIAS',
            'ANDROID_KEY_PASSWORD'
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing required Android release signing secret: $name"
            }
          }

          $keystorePath = Join-Path $env:RUNNER_TEMP 'audiobridge-release.jks'
          [IO.File]::WriteAllBytes(
            $keystorePath,
            [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          )
          "ANDROID_KEYSTORE_PATH=$keystorePath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ANDROID_KEYSTORE_PASSWORD=$env:ANDROID_KEYSTORE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ANDROID_KEY_ALIAS=$env:ANDROID_KEY_ALIAS" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ANDROID_KEY_PASSWORD=$env:ANDROID_KEY_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Stage Android APK
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)' | ForEach-Object { $_.Matches[0].Groups[1].Value })
          New-Item -ItemType Directory -Force -Path build/release | Out-Null
          Copy-Item build/app/outputs/flutter-apk/app-release.apk "build/release/AudioBridge-$version-android.apk"

      - name: Build Windows app
        run: flutter build windows --release

      - name: Build Windows MSI
        shell: pwsh
        run: .\scripts\package_windows_msi.ps1 -SkipFlutterBuild

      - name: Upload MSI to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/installer/AudioBridge-*-x64.msi
            build/release/AudioBridge-*-android.apk
