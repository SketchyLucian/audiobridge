name: Dev CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  flutter:
    name: Flutter checks
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Use workspace Pub cache
        shell: pwsh
        run: |
          $pubCache = Join-Path $env:GITHUB_WORKSPACE '.pub-cache'
          "PUB_CACHE=$pubCache" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Android native unit tests
        working-directory: android
        run: .\gradlew.bat testDebugUnitTest

      - name: Build Windows debug app
        run: flutter build windows --debug

      - name: Build Android debug APK
        run: flutter build apk --debug
