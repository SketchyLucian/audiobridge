name: Dev CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  flutter:
    name: Flutter checks
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'

      - name: Use workspace Pub cache
        shell: pwsh
        run: |
          $pubCache = Join-Path $env:GITHUB_WORKSPACE '.pub-cache'
          "PUB_CACHE=$pubCache" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Android native unit tests
        working-directory: android
        run: .\gradlew.bat :app:testDebugUnitTest

      - name: Build Windows debug app
        run: flutter build windows --debug

      - name: Build Android debug APK
        run: flutter build apk --debug

  linux:
    name: Linux build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Linux debug app
        run: flutter build linux --debug
